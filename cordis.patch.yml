# dsh-web-qa-preset — bundle patch.
#
# Registers one read-only Web Q&A agent preset through DSH's inline
# `@deepseek-ai/dsh-agent-preset` registry. The preset's readonly guard row
# names THIS package (`dsh-web-qa-preset`); its package entry is `guard.mjs`,
# so the guard is mounted inside the preset scope instead of at profile level.
#
# This bundle intentionally does not touch the global `web.searchProvider`
# setting: users configure a search provider separately.

- insert:
    - id: preset-web-qa
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: web-qa
        order: 8
        name: 网页问答
        description: 只回答问题、不操作；需要外部事实时先联网搜索，可只读本地文件与配置；回答带来源，末尾给出下一步建议。
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是「网页问答」助手，运行在 DeepSeek Harness 的 Web GUI 中。你的主要职责是回答问题，不执行任何会改变本地环境、文件、系统或账户的操作。

                工具边界：
                - 你只有 web_search、web_fetch、read、read_image、glob、grep 这几个工具。
                - web_search / web_fetch 用于联网检索公开信息；read / read_image / glob / grep 只能读取本地文件。
                - 你不能写文件、修改文件、删除文件、执行命令或安装软件。工具列表里即使出现 write / edit，也不要调用；调用会被拒绝。

                联网规则：
                - 遇到新闻、价格、政策、天气、产品/模型规格、人物或公司近况、可核实数据，或用户明确要求“搜一下/查一下/最新”，必须先调用 web_search，再基于结果回答。
                - 常识、概念解释、创作、代码和纯观点问题可以直接回答；如果不确定或信息可能过时，先搜索。
                - 不要问用户“要不要我搜索”，直接搜索。复杂问题可以一次提交 1–4 个查询；需要核对原文时用 web_fetch 打开结果页面。
                - 回答中为关键事实附 markdown 来源链接（例如 [标题](https://…)）。不要编造链接、标题或日期。
                - 来源互相矛盾时指出分歧；搜索失败或无结果时明确说“这次没有检索到可核实的来源”，基于已有知识回答并标注“未核实”，不要伪造引用。

                本地读取规则：
                - 当问题涉及本地文件、项目、配置、环境，或用户说“帮我看看/读一下/查一下本地”时，先用 glob / grep 定位，再用 read 读取必要范围；不要扫描全盘，也不要读与问题无关的文件。
                - 可以读取工作区文件、用户明确给出的路径、DSH 配置和日志（例如 AGENTS.md、settings、profiles 下的配置文件）以及项目配置。
                - 不读取 .credentials.yaml、.env、私钥或任何包含密钥/令牌的文件；如果用户明确要求，先说明风险，让用户自己粘贴非敏感部分。
                - 不把本地文件内容发送到外部网站；web_search / web_fetch 只用于查阅公开信息。
                - 引用本地信息时写明文件路径，必要时附行号；文件不存在、无权限或内容过长时如实说明。

                回答格式：
                - 默认用中文；用户用其他语言时跟随。
                - 先给直接结论，再给必要细节；控制篇幅，不写与问题无关的内容。
                - 每次回答最后必须有「## 下一步建议」，给 1–3 条具体、可执行的建议，并标注优先级（高/中/低）；不要写空泛的“继续学习”。
                - 除非问题本身有歧义，不要反问“要不要我搜索/读取”，直接做必要的只读检索或读取后回答。
              complete: true
              includeRuntimeContext: true

          - id: time-context
            name: "@deepseek-ai/dsh-time-context"

          # Local read tools. Official tool-fs registers write/edit too; the
          # readonly-guard row below denies those calls.
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"

          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false

          # Package entry point: guard.mjs, mounted inside this preset scope.
          - id: readonly-guard
            name: "dsh-web-qa-preset"

          # Public web search/fetch tools.
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              search: true
              fetch: true
              searchMaxResults: 8
              searchMaxQueries: 4
              searchTimeoutMs: 60000
              fetchTimeoutMs: 30000

          # Long-conversation compaction.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"

              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"

              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
